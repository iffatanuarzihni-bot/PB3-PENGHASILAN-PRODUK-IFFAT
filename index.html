<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akademi Bahasa Pokémon | Dunia Pembelajaran 8-Bit</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ==================== SISTEM REKA BENTUK POKÉMON RPG ==================== */
:root{
  --ink:#101c36;
  --navy:#192b4d;
  --paper:#fffdf4;
  --panel:#f3f7ff;
  --pri:#2c6bed;
  --gold:#ffcb05;
  --gold-dark:#e0a800;
  --grn:#35c46a;
  --red:#ef3e4a;
  --mut:#5d6c89;
  --sky-top:#0d1630;
  --sky-mid:#1a2f5a;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font:600 16px/1.5 "Baloo 2",system-ui,sans-serif;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,203,5,.14), transparent 38%),
    radial-gradient(circle at 80% 15%, rgba(44,107,237,.22), transparent 40%),
    linear-gradient(180deg, #101b38 0%, #1c3566 48%, #24578a 100%) fixed;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(2px 2px at 25px 35px,#fff,transparent),
    radial-gradient(2px 2px at 140px 85px,#ffe57f,transparent),
    radial-gradient(1.5px 1.5px at 80px 160px,#90caf9,transparent),
    radial-gradient(2px 2px at 210px 45px,#fff,transparent);
  background-size:240px 200px;
  opacity:.55;
  animation:twinkle 3s ease-in-out infinite alternate;
  z-index:0;
}
@keyframes twinkle{to{opacity:.2}}

.wrap{
  position:relative;
  z-index:2;
  max-width:980px;
  margin:0 auto;
  padding:1.2rem 1rem 3.5rem;
  animation:pop .32s ease-out;
  pointer-events:none;
}
.wrap>*{pointer-events:auto}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}

.audio-dock{
  position:fixed;
  top:14px;
  right:14px;
  z-index:50;
  display:flex;
  gap:.45rem;
}
.audio-btn{
  display:inline-flex;
  align-items:center;
  gap:.4rem;
  padding:.45rem .8rem;
  font:400 .62rem "Press Start 2P",monospace;
  border:3px solid var(--ink);
  border-radius:12px;
  background:var(--paper);
  color:var(--ink);
  box-shadow:0 4px 0 var(--ink);
  cursor:pointer;
}
.audio-btn.on{background:var(--gold)}
.audio-btn:hover{transform:translateY(-2px)}
.audio-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

h1,h2{margin:0 0 .5rem;line-height:1.3}
h1{
  font:400 1.2rem/1.55 "Press Start 2P",monospace;
  color:var(--gold);
  text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);
}
h1.logo{
  font-size:clamp(1.25rem,3.6vw,2rem);
  text-align:center;
  text-shadow:3px 3px 0 #1f4ca8, 5px 5px 0 var(--ink);
  animation:glowTitle 2.2s ease-in-out infinite alternate;
}
@keyframes glowTitle{to{transform:scale(1.03)}}
h2{font-size:1.3rem;font-weight:800;color:var(--navy)}
.sub{color:#dce9ff;text-align:center;margin:.2rem 0 1.1rem;font-size:1.05rem}
.mut{color:var(--mut)}
.top .mut{color:#cfe0ff}

button{
  font:inherit;
  font-weight:800;
  cursor:pointer;
  border:3px solid var(--ink);
  border-radius:14px;
  padding:.58rem 1.05rem;
  background:linear-gradient(180deg,#ffe054,var(--gold));
  color:var(--ink);
  box-shadow:0 5px 0 var(--ink);
  transition:transform .1s,box-shadow .1s,filter .15s;
}
button:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink);filter:brightness(1.04)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button.ghost{background:#fff;color:var(--navy)}
button.danger{background:var(--red);color:#fff}
button.skip-btn{background:#ffb300;color:#3a2600;border:2px dashed #7a4f00}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

input{
  font:inherit;
  padding:.58rem .75rem;
  border:3px solid var(--ink);
  border-radius:12px;
  width:100%;
  background:#fff;
  color:var(--ink);
}
label{display:block;font-weight:800;font-size:.9rem;margin-bottom:.2rem;color:var(--navy)}

.card{
  position:relative;
  background:var(--paper);
  border:4px solid var(--ink);
  border-radius:22px;
  padding:1.2rem;
  margin-bottom:1.25rem;
  box-shadow:0 8px 0 rgba(10,18,38,.45), inset 0 0 0 3px #e8eefc;
}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:.85rem;align-items:end}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.2rem;flex-wrap:wrap}

.tag{
  display:inline-block;
  padding:.08rem .65rem;
  border:2px solid var(--ink);
  border-radius:99px;
  font-size:.78rem;
  font-weight:800;
  background:#dce8ff;
  color:var(--navy);
}
.tag.ok{background:#c5f7d5;color:#11572b}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.55rem .45rem;border-bottom:2px dashed #d3dced;vertical-align:middle}
th{font-size:.82rem;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}

.bar{
  height:17px;
  background:#dce4f2;
  border:3px solid var(--ink);
  border-radius:99px;
  overflow:hidden;
  min-width:95px;
}
.bar i{display:block;height:100%;background:linear-gradient(#5cf297,#22b862);transition:width .55s ease}
.xp i{background:linear-gradient(#ffe36e,#f5a600)}
.hp.mid i{background:linear-gradient(#ffe066,#f7b500)}
.hp.low i{background:linear-gradient(#ff8fa3,#ef3e4a)}

.err{
  background:#ffe2e6;
  color:#9c142a;
  border:3px solid var(--ink);
  padding:.65rem .9rem;
  border-radius:14px;
  margin-bottom:1rem;
  font-weight:800;
}
.q{margin:1rem 0}

.mon{display:flex;align-items:center;justify-content:center;flex:none}
.mon img,.pokemon-sprite{
  display:block;
  max-width:100%;
  height:auto;
  object-fit:contain;
  image-rendering:pixelated;
  filter:drop-shadow(0 6px 2px rgba(16,28,54,.28));
}
.sil img{filter:brightness(0) opacity(.35)}
.float{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}

/* Grid Video Kata Imbuhan & Kata Majmuk */
.video-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:1rem;
  margin-top:.8rem;
}
.video-box{
  background:#f4f8ff;
  border:3px solid var(--ink);
  border-radius:18px;
  padding:1rem;
  display:flex;
  flex-direction:column;
  gap:.65rem;
}
.video-frame-wrap{
  position:relative;
  width:100%;
  padding-top:56.25%;
  border:3px solid var(--ink);
  border-radius:14px;
  overflow:hidden;
  background:#0d1630;
}
.video-frame-wrap iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}

/* ==================== SKRIN MULA ==================== */
.start-screen{
  position:relative;
  min-height:84vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:2.2rem 1.4rem 2.3rem;
  border:5px solid var(--ink);
  border-radius:30px;
  background:radial-gradient(circle at 50% 25%, #2b4e94 0%, #162852 55%, #0c142b 100%);
  box-shadow:0 12px 0 var(--ink), 0 25px 50px rgba(0,0,0,.55);
  overflow:hidden;
  color:#fff;
}
.start-screen:before{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 2px, transparent 2px 4px);
  pointer-events:none;
  z-index:1;
}
.start-grid-floor{
  position:absolute;
  left:-20%;
  right:-20%;
  bottom:-45px;
  height:180px;
  background:
    linear-gradient(transparent 0%, rgba(44,107,237,.35) 100%),
    repeating-linear-gradient(90deg, rgba(255,203,5,.15) 0 2px, transparent 2px 48px),
    repeating-linear-gradient(0deg, rgba(255,203,5,.15) 0 2px, transparent 2px 32px);
  transform:perspective(220px) rotateX(55deg);
  pointer-events:none;
  z-index:1;
}
.start-badge{
  position:relative;
  z-index:3;
  display:inline-flex;
  align-items:center;
  gap:.5rem;
  padding:.38rem .95rem;
  border:2px solid var(--gold);
  border-radius:99px;
  background:rgba(16,28,54,.85);
  color:var(--gold);
  font:400 .62rem "Press Start 2P",monospace;
  letter-spacing:.08em;
  margin-bottom:.95rem;
  box-shadow:0 4px 0 #091020;
}
.start-title{
  position:relative;
  z-index:3;
  font:400 clamp(1.35rem,4.2vw,2.35rem)/1.35 "Press Start 2P",monospace;
  color:var(--gold);
  text-shadow:4px 4px 0 #2157c2, 7px 7px 0 #091020;
  margin:0 0 .55rem;
  animation:titleFloat 2.8s ease-in-out infinite;
}
@keyframes titleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.start-sub{
  position:relative;
  z-index:3;
  max-width:580px;
  color:#d7e7ff;
  font-size:1.08rem;
  margin:0 auto 1.2rem;
}
.battle-stage{
  position:relative;
  z-index:3;
  width:100%;
  max-width:720px;
  height:265px;
  margin:.4rem auto 1.65rem;
  border:4px solid var(--ink);
  border-radius:24px;
  background:
    radial-gradient(circle at 22% 55%, rgba(255,220,50,.18), transparent 45%),
    linear-gradient(180deg, #1b2f61 0%, #2b4c8c 54%, #3c9b52 54%, #256e38 100%);
  box-shadow:inset 0 0 32px rgba(0,0,0,.45), 0 9px 0 #091020;
  overflow:hidden;
  animation:stageShake 3.6s infinite;
}
@keyframes stageShake{
  0%, 40%, 66%, 100%{transform:translate(0,0)}
  43%{transform:translate(-7px, 5px)}
  46%{transform:translate(7px, -5px)}
  49%{transform:translate(-6px, -4px)}
  52%{transform:translate(6px, 4px)}
  55%{transform:translate(-4px, 2px)}
}
.stage-cloud{
  position:absolute;
  top:14%;
  font-size:1.7rem;
  opacity:.35;
  animation:driftSlow 18s linear infinite;
}
.stage-cloud.c2{top:27%;font-size:1.25rem;animation-delay:-9s}
@keyframes driftSlow{from{left:-12%}to{left:108%}}
.stage-hud{
  position:absolute;
  padding:.35rem .6rem;
  background:rgba(255,253,244,.94);
  color:var(--ink);
  border:3px solid var(--ink);
  border-radius:10px;
  font:400 .55rem "Press Start 2P",monospace;
  z-index:6;
  text-align:left;
  box-shadow:0 3px 0 rgba(0,0,0,.35);
}
.stage-hud.hero{left:14px;top:12px}
.stage-hud.foe{right:14px;top:12px;min-width:165px}
.mini-hp{
  height:8px;
  margin-top:5px;
  border:2px solid var(--ink);
  border-radius:99px;
  background:#d8e0ef;
  overflow:hidden;
}
.mini-hp i{display:block;height:100%;background:#35c46a}
.foe-hp-bar{animation:foeHpDrop 3.6s infinite}
@keyframes foeHpDrop{
  0%, 40%{width:100%;background:#35c46a}
  48%, 78%{width:18%;background:#ef3e4a}
  92%, 100%{width:100%;background:#35c46a}
}
.stage-flash{
  position:absolute;
  inset:0;
  background:#fffbe0;
  opacity:0;
  pointer-events:none;
  z-index:7;
  animation:thunderFlash 3.6s infinite;
}
@keyframes thunderFlash{
  0%, 39%, 55%, 100%{opacity:0}
  41%{opacity:.82}
  44%{opacity:.15}
  47%{opacity:.65}
}
.stage-platform{
  position:absolute;
  bottom:24px;
  width:155px;
  height:36px;
  border-radius:50%;
  background:radial-gradient(ellipse, rgba(16,28,54,.65), rgba(16,28,54,.25));
  border:3px solid rgba(255,255,255,.22);
}
.plat-left{left:7%}
.plat-right{right:7%}
.hero-pikachu{
  position:absolute;
  left:9%;
  bottom:30px;
  width:132px;
  height:132px;
  z-index:4;
  animation:pikaAttackCycle 3.6s infinite;
}
.hero-pikachu img{
  width:100%;
  height:100%;
  image-rendering:pixelated;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.45));
}
@keyframes pikaAttackCycle{
  0%, 14%{transform:translateX(0) scale(1)}
  24%{transform:translateX(-14px) scale(1.1, .9)}
  34%{transform:translateY(-30px) translateX(22px) scale(1.14)}
  44%{transform:translateY(0) translateX(14px) scale(1.06)}
  68%, 100%{transform:translateX(0) scale(1)}
}
.electric-aura{
  position:absolute;
  inset:-18px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,235,59,.9) 0%, rgba(255,193,7,.4) 48%, transparent 72%);
  opacity:0;
  animation:auraCharge 3.6s infinite;
}
@keyframes auraCharge{
  0%, 14%, 56%, 100%{opacity:0;transform:scale(.55)}
  28%, 44%{opacity:1;transform:scale(1.3)}
}
.charge-ring{
  position:absolute;
  inset:-24px;
  border:4px dashed #ffeb3b;
  border-radius:50%;
  opacity:0;
  animation:ringSpin 3.6s infinite;
}
@keyframes ringSpin{
  0%, 16%, 52%, 100%{opacity:0;transform:rotate(0deg) scale(.6)}
  30%, 44%{opacity:.95;transform:rotate(180deg) scale(1.15)}
}
.lightning-beam{
  position:absolute;
  left:23%;
  top:27%;
  width:54%;
  height:120px;
  z-index:5;
  opacity:0;
  transform-origin:left center;
  animation:boltShoot 3.6s infinite;
}
@keyframes boltShoot{
  0%, 35%{opacity:0;transform:scaleX(0)}
  39%{opacity:1;transform:scaleX(1)}
  54%{opacity:1;transform:scaleX(1)}
  62%, 100%{opacity:0;transform:scaleX(1)}
}
.target-dummy{
  position:absolute;
  right:9%;
  bottom:32px;
  width:120px;
  height:120px;
  z-index:4;
  animation:dummyHit 3.6s infinite;
}
.target-dummy img{
  width:100%;
  height:100%;
  image-rendering:pixelated;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.45));
}
@keyframes dummyHit{
  0%, 39%{transform:translateX(0);filter:brightness(1)}
  42%{transform:translateX(16px) rotate(9deg);filter:brightness(2.8) sepia(1) hue-rotate(15deg)}
  47%{transform:translateX(-11px) rotate(-7deg);filter:brightness(2.2)}
  52%{transform:translateX(9px);filter:brightness(1.6)}
  66%, 100%{transform:translateX(0) rotate(0);filter:brightness(1)}
}
.attack-label{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  background:var(--gold);
  color:var(--ink);
  border:3px solid var(--ink);
  border-radius:12px;
  padding:.32rem .85rem;
  font:400 .62rem "Press Start 2P",monospace;
  z-index:8;
  opacity:0;
  white-space:nowrap;
  box-shadow:0 4px 0 var(--ink);
  animation:labelPop 3.6s infinite;
}
@keyframes labelPop{
  0%, 32%{opacity:0;transform:translate(-50%, 10px) scale(.85)}
  38%, 58%{opacity:1;transform:translate(-50%, 0) scale(1)}
  66%, 100%{opacity:0;transform:translate(-50%, -6px)}
}
.spark-burst{
  position:absolute;
  right:12%;
  top:26%;
  font-size:2.1rem;
  z-index:8;
  opacity:0;
  animation:burstPop 3.6s infinite;
}
@keyframes burstPop{
  0%, 39%, 62%, 100%{opacity:0;transform:scale(.4) rotate(0deg)}
  45%{opacity:1;transform:scale(1.4) rotate(25deg)}
}
.crit-dmg{
  position:absolute;
  right:15%;
  top:22%;
  font:400 .95rem "Press Start 2P",monospace;
  color:#ffeb3b;
  text-shadow:3px 3px 0 #ef3e4a, -2px -2px 0 var(--ink);
  z-index:8;
  opacity:0;
  animation:critPop 3.6s infinite;
}
@keyframes critPop{
  0%, 40%{opacity:0;transform:translateY(10px) scale(.6)}
  46%{opacity:1;transform:translateY(-16px) scale(1.15)}
  62%{opacity:1;transform:translateY(-30px) scale(1)}
  70%, 100%{opacity:0;transform:translateY(-40px)}
}
.btn-start-game{
  position:relative;
  z-index:4;
  display:inline-flex;
  align-items:center;
  gap:.85rem;
  padding:1.05rem 2.6rem;
  font:400 1.25rem "Press Start 2P",monospace;
  color:var(--ink);
  background:linear-gradient(180deg, #ffe85e 0%, #ffcb05 55%, #f0a500 100%);
  border:4px solid var(--ink);
  border-radius:18px;
  box-shadow:0 8px 0 var(--ink), 0 0 28px rgba(255,203,5,.65);
  animation:pulseBtn 1.5s ease-in-out infinite;
}
.btn-start-game:hover{
  transform:translateY(-4px) scale(1.04);
  box-shadow:0 12px 0 var(--ink), 0 0 40px rgba(255,203,5,.95);
}
.btn-start-game:active{transform:translateY(5px);box-shadow:0 3px 0 var(--ink)}
@keyframes pulseBtn{
  0%,100%{box-shadow:0 8px 0 var(--ink), 0 0 18px rgba(255,203,5,.55)}
  50%{box-shadow:0 8px 0 var(--ink), 0 0 38px rgba(255,203,5,.95)}
}
.start-hint{
  position:relative;
  z-index:3;
  margin-top:1.05rem;
  font:400 .6rem "Press Start 2P",monospace;
  color:#9fc0ff;
  letter-spacing:.06em;
  animation:blinkText 1.2s step-end infinite;
}
@keyframes blinkText{50%{opacity:.3}}

.hub-nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:.9rem;
  gap:.6rem;
  flex-wrap:wrap;
}
.world-banner{
  position:relative;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  align-items:center;
  min-height:240px;
  margin:1rem 0 1.4rem;
  padding:1.35rem 1.6rem;
  border:4px solid var(--ink);
  border-radius:26px;
  overflow:hidden;
  background:linear-gradient(125deg,#fff8d6 0%,#ffffff 52%,#cce8ff 100%);
  box-shadow:0 9px 0 rgba(10,18,38,.45);
}
.world-banner:before{
  content:"";
  position:absolute;
  left:-6%;
  right:-6%;
  bottom:-58px;
  height:122px;
  border-radius:50% 50% 0 0;
  background:linear-gradient(#6ed676,#3ea859);
  border-top:4px solid var(--ink);
  transform:rotate(-2deg);
}
.world-copy{position:relative;z-index:2;max-width:480px}
.world-kicker{
  display:inline-block;
  padding:.26rem .7rem;
  border:2px solid var(--ink);
  border-radius:99px;
  background:var(--pri);
  color:#fff;
  font:400 .58rem "Press Start 2P",monospace;
}
.world-copy h2{font-size:clamp(1.35rem,3.2vw,2.05rem);line-height:1.18;margin:.7rem 0 .4rem;color:var(--ink)}
.world-copy p{max-width:430px;margin:.3rem 0 .85rem;color:#3c4f6e}
.world-stats{display:flex;flex-wrap:wrap;gap:.45rem}
.world-stats span{
  font-size:.8rem;
  font-weight:800;
  background:#fff;
  border:2px solid var(--ink);
  border-radius:99px;
  padding:.2rem .65rem;
}
.world-characters{
  position:relative;
  z-index:2;
  min-height:195px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.world-poke{position:absolute;display:grid;place-items:center}
.world-eevee{left:6%;bottom:20px;animation:bob 3.2s ease-in-out infinite}
.world-pikachu{z-index:2;left:32%;bottom:12px;animation:bob 2.2s ease-in-out infinite}
.world-bulba{right:2%;bottom:16px;animation:bob 2.9s ease-in-out infinite reverse}

.section-heading{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:.65rem;
  margin:1.2rem 0 .85rem;
  color:#fff;
}
.section-heading h2{
  margin:0;
  font:400 1rem "Press Start 2P",monospace;
  color:var(--gold);
  text-shadow:2px 2px 0 var(--ink);
}
.section-heading span{font-size:1.4rem}

.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin:0 0 1.4rem}
.role{
  position:relative;
  min-height:175px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:.35rem;
  text-align:center;
  padding:1.15rem .85rem;
  background:var(--paper);
  border:4px solid var(--ink);
  border-radius:22px;
  box-shadow:0 8px 0 var(--ink);
  transition:transform .16s,box-shadow .16s;
}
.role:hover{transform:translateY(-6px);box-shadow:0 12px 0 var(--ink)}
.role:hover .mon{animation:jump .48s}
@keyframes jump{40%{transform:translateY(-14px) scale(1.1)}}
.role .mon{width:90px;height:90px}
.role-info{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  width:100%;
}

/* =====================================================================
   0) ENJIN MUZIK 8-BIT & KESAN BUNYI (WEB AUDIO API CHIPTUNE)
   ===================================================================== */
const Chiptune = (() => {
  const MUTE_KEY = "bd_music_muted";
  let ctx = null;
  let enabled = false;
  let userMuted = false;
  try {
    userMuted = sessionStorage.getItem(MUTE_KEY) === "1";
  } catch (e) {}

  let currentTrack = "menu";
  let step = 0;
  let timer = null;
  let noiseBuf = null;

  const N = {
    _:0,
    C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196.00, A3:220.00, B3:246.94,
    C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, Gs4:415.30, A4:440.00, Bb4:466.16, B4:493.88,
    C5:523.25, D5:587.33, Eb5:622.25, E5:659.25, F5:698.46, Fs5:739.99, G5:783.99, Gs5:830.61, A5:880.00, B5:987.77, C6:1046.50
  };

  const MENU_TRACK = {
    tempoMs: 145,
    lead: [
      "E5","G5","C6","G5","E5","G5","A5","G5",
      "F5","A5","G5","E5","D5","E5","F5","D5",
      "E5","G5","C6","G5","A5","B5","C6","G5",
      "F5","E5","D5","G5","C5","_","G4","_"
    ],
    bass: [
      "C3","G3","C3","G3","A3","E3","A3","E3",
      "F3","C3","G3","D3","G3","D3","G3","B3",
      "C3","G3","C3","G3","F3","C3","E3","C3",
      "D3","G3","G3","G3","C3","G3","C3","_"
    ]
  };

  const BATTLE_TRACK = {
    tempoMs: 112,
    lead: [
      "E5","Eb5","E5","Eb5","E5","G5","Fs5","E5",
      "D5","F5","E5","D5","C5","E5","D5","B4",
      "E5","G5","A5","G5","Fs5","E5","D5","E5",
      "F5","G5","Gs5","A5","B5","G5","E5","_"
    ],
    bass: [
      "E3","E3","B3","E3","E3","E3","B3","E3",
      "D3","D3","A3","D3","C3","C3","G3","B3",
      "E3","E3","B3","E3","D3","D3","A3","D3",
      "F3","G3","Gs4","A3","B3","B3","E3","_"
    ]
  };

  function saveMuteState(){
    try {
      if (userMuted) sessionStorage.setItem(MUTE_KEY, "1");
      else sessionStorage.removeItem(MUTE_KEY);
    } catch (e) {}
  }

  function ensureCtx(){
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      ctx = new AC();
      const len = ctx.sampleRate * 0.08;
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++) data[i] = Math.random()*2 - 1;
    }
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function playTone(freq, dur, type, vol){
    if(!freq || !ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.01);
  }

  function playHitHat(vol){
    if(!ctx || !noiseBuf) return;
    const now = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
    src.connect(gain);
    gain.connect(ctx.destination);
    src.start(now);
  }

  function tick(){
    if(!enabled || userMuted) return;
    const tr = currentTrack === "battle" ? BATTLE_TRACK : MENU_TRACK;
    const idx = step % tr.lead.length;
    const leadNote = N[tr.lead[idx]];
    const bassNote = N[tr.bass[idx]];
    const dur = tr.tempoMs / 1000 * 0.88;

    if(leadNote) playTone(leadNote, dur, "square", 0.032);
    if(bassNote) playTone(bassNote, dur, "triangle", 0.055);
    if(idx % 2 === 1) playHitHat(currentTrack === "battle" ? 0.024 : 0.014);
    step++;
  }

  function startLoop(){
    stopLoop();
    if(!enabled || userMuted) return;
    const tr = currentTrack === "battle" ? BATTLE_TRACK : MENU_TRACK;
    timer = setInterval(tick, tr.tempoMs);
  }

  function stopLoop(){
    if(timer){ clearInterval(timer); timer = null; }
  }

  function updateUI(){
    const btn = document.getElementById("musicBtn");
    if(!btn) return;
    const isPlaying = enabled && !userMuted;
    btn.classList.toggle("on", isPlaying);
    btn.textContent = isPlaying ? "🎵 Muzik 8-Bit: ON" : "🎵 Muzik: OFF";
  }

  return {
    enable(){
      if(userMuted) {
        updateUI();
        return;
      }
      ensureCtx();
      if(!enabled){
        enabled = true;
        startLoop();
        updateUI();
      }
    },
    toggle(){
      if(enabled && !userMuted){
        userMuted = true;
        enabled = false;
        saveMuteState();
        stopLoop();
        updateUI();
      } else {
        userMuted = false;
        saveMuteState();
        ensureCtx();
        enabled = true;
        startLoop();
        updateUI();
      }
    },
    setTrack(name){
      if(currentTrack === name) return;
      currentTrack = name;
      step = 0;
      if(enabled && !userMuted) startLoop();
    },
    sfx(freq, dur=0.12, type="square", vol=0.055){
      if(userMuted) return;
      const c = ensureCtx();
      if(c) playTone(freq, dur, type, vol);
    },
    fanfare(){
      if(userMuted) return;
      const c = ensureCtx();
      if(!c) return;
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        setTimeout(() => { if(!userMuted) playTone(f, 0.16, "square", 0.05); }, i * 110);
      });
    },
    thunder(){
      if(userMuted) return;
      const c = ensureCtx();
      if(!c) return;
      [980, 740, 1120, 620].forEach((f, i) => {
        setTimeout(() => { if(!userMuted) playTone(f, 0.07, "sawtooth", 0.045); }, i * 45);
      });
    }
  };
})();

    id:"g1", mon:{n:"Bulbasaur",c:"#4cd27a",k:1}, n:3, hearts:4,
    badge:"Lencana Alam (Nature Badge)",
    title:"Hutan Rumput: Kata Berimbuhan", subject:"Bahasa Melayu · Ketua Gim Flora",
    lead:"Flora: Selamat datang ke Hutan Rumput! Tunjukkan kemahiran kata berimbuhan anda untuk mendapat Lencana Alam.",
    text:"Kata berimbuhan ialah kata akar yang ditambah imbuhan.\n• Awalan: di hadapan kata akar. Contoh: ber + main = bermain; me + baca = membaca.\n• Akhiran: di belakang kata akar. Contoh: makan + an = makanan; tulis + an = tulisan.\n• Apitan: di hadapan dan di belakang kata akar serentak. Contoh: per + main + an = permainan; ke + indah + an = keindahan.",
    q:[
      {q:"Perkataan manakah mengandungi awalan?",o:["makanan","bermain","tulisan","sayuran"],a:1,e:"Bermain = awalan ber- + kata akar main. Makanan, tulisan dan sayuran mempunyai akhiran -an.",x:"ber + main = bermain"},
      {q:"Perkataan manakah mengandungi akhiran?",o:["berjalan","membaca","makanan","bermain"],a:2,e:"Makanan = makan + akhiran -an. Akhiran terletak di belakang kata akar.",x:"tulis + an = tulisan"},
      {q:"Perkataan manakah mengandungi apitan?",o:["permainan","membaca","berjalan","makanan"],a:0,e:"Permainan = per- (di hadapan) + main + -an (di belakang). Imbuhan di kedua-dua hujung dipanggil apitan.",x:"per + main + an = permainan"},
      {q:"Apakah awalan bagi perkataan berlari?",o:["ber-","ter-","me-","di-"],a:0,e:"Berlari = ber- + lari. Awalan ber- diletakkan di hadapan kata akar.",x:"ber + lari = berlari"},
      {q:"Apakah kata akar bagi perkataan makanan?",o:["makan","mak","anan","makana"],a:0,e:"Buang imbuhan -an daripada makanan, maka tinggallah kata akar makan.",x:"makanan → makan"},
      {q:"Adik sedang ____ buku cerita di perpustakaan.",o:["membaca","berbaca","pembaca","bacaan"],a:0,e:"Kata kerja aktif memerlukan awalan me-. Me- + baca = membaca (me- menjadi mem- sebelum huruf b).",x:"Adik sedang membaca buku cerita."},
      {q:"Perkataan manakah mengandungi akhiran -an?",o:["melukis","lukisan","berlukis","dilukis"],a:1,e:"Lukisan = lukis + -an. Melukis, berlukis dan dilukis mempunyai awalan, bukan akhiran.",x:"lukis + an = lukisan"},
      {q:"Kata akar jalan + awalan ber- membentuk perkataan ...",o:["berjalan","jalanan","menjalan","terjalan"],a:0,e:"Ber- + jalan = berjalan. Jalanan mempunyai akhiran -an, bukan awalan ber-.",x:"Kami berjalan ke sekolah."},
      {q:"Ayah ____ kereta ke pejabat setiap pagi.",o:["memandu","berpandu","dipandu","pandukan"],a:0,e:"Ayah ialah pelaku, maka kata kerja aktif me- + pandu = memandu digunakan.",x:"Ayah memandu kereta."},
      {q:"Perkataan manakah mengandungi apitan?",o:["gembira","bergembira","kegembiraan","gembiraan"],a:2,e:"Kegembiraan = ke- + gembira + -an. Ada imbuhan di hadapan dan di belakang.",x:"ke + gembira + an = kegembiraan"},
      {q:"Perkataan manakah menggunakan awalan di-?",o:["makanan","memakan","bermakan","dimakan"],a:3,e:"Dimakan = di- + makan. Awalan di- menunjukkan perbuatan yang dikenakan pada sesuatu.",x:"Kuih itu dimakan oleh adik."},
      {q:"Perkataan manakah mengandungi akhiran -kan?",o:["ambilan","mengambil","ambilkan","diambil"],a:2,e:"Ambilkan = ambil + -kan. Akhiran -kan berada di hujung perkataan.",x:"Tolong ambilkan buku itu."},
      {q:"Perkataan manakah mengandungi akhiran -i?",o:["dekatan","dekati","berdekat","mendekat"],a:1,e:"Dekati = dekat + -i. Akhiran -i berada di hujung kata akar.",x:"Jangan dekati api itu."},
      {q:"Perkataan manakah mengandungi awalan ter-?",o:["jatuhan","terjatuh","berjatuh","menjatuh"],a:1,e:"Terjatuh = ter- + jatuh. Ter- menunjukkan perbuatan yang tidak sengaja.",x:"Adik terjatuh dari basikal."},
      {q:"Perkataan sekelas terdiri daripada awalan ...",o:["ke-","ber-","pe-","se-"],a:3,e:"Sekelas = se- + kelas. Awalan se- bermaksud satu atau sama.",x:"Kami sekelas dengan Ali."},
      {q:"Perkataan pemakanan ialah kata berimbuhan jenis ...",o:["awalan","akhiran","apitan","kata akar"],a:2,e:"Pemakanan = pe- + makan + -an. Terdapat imbuhan di hadapan dan di belakang, maka ia apitan.",x:"Pemakanan sihat penting untuk badan."},
      {q:"Ali ____ bola di padang bersama kawan-kawan.",o:["mainan","pemain","bermain","permainan"],a:2,e:"Ayat memerlukan kata kerja. Ber- + main = bermain. Mainan, pemain dan permainan ialah kata nama.",x:"Ali bermain bola di padang."}
    ]
  },

  /* ============ WILAYAH 2: BANDAR METRO (KATA MAJMUK) ============ */
  {
    id:"g2", mon:{n:"Pikachu",c:"#ffcf33",k:0}, n:3, hearts:4,
    badge:"Lencana Pengetahuan (Knowledge Badge)",
    title:"Bandar Metro: Kata Majmuk", subject:"Bahasa Melayu · Ketua Gim Volt",
    lead:"Volt: Bandar Metro menanti! Selesaikan teka-teki kata majmuk untuk mendapat Lencana Pengetahuan.",
    text:"Kata majmuk ialah gabungan dua kata atau lebih yang membawa satu makna.\n• Kata majmuk bebas: gabungan kata yang ditulis berasingan. Contoh: kereta api, meja makan, jalan raya.\n• Kata majmuk mantap: gabungan kata yang sudah tetap dan ditulis rapat. Contoh: matahari, kerjasama, tanggungjawab.",
    q:[
      {q:"Antara berikut, yang manakah kata majmuk bebas?",o:["hospital","kereta api","matahari","kerjasama"],a:1,e:"Kereta api ialah gabungan dua kata (kereta + api) yang ditulis berasingan dan membawa satu makna baharu. 'Hospital' ialah kata tunggal.",x:"Ayah menaiki kereta api."},
      {q:"Antara berikut, yang manakah kata majmuk mantap?",o:["hospital","matahari","meja makan","jalan raya"],a:1,e:"Matahari ialah gabungan mata + hari yang sudah tetap dan ditulis rapat.",x:"Matahari terbit di timur."},
      {q:"Perkataan manakah kata majmuk mantap?",o:["buku teks","kapal terbang","tanggungjawab","lampu isyarat"],a:2,e:"Tanggungjawab ditulis rapat sebagai satu perkataan. Yang lain ialah kata majmuk bebas.",x:"Murid harus memikul tanggungjawab."},
      {q:"Perkataan manakah kata majmuk bebas?",o:["matahari","kerjasama","kapal terbang","hulubalang"],a:2,e:"Kapal terbang ditulis berasingan, maka ia kata majmuk bebas.",x:"Kapal terbang mendarat di lapangan terbang."},
      {q:"Gabungkan perkataan meja dan makan.",o:["meja makan","makan meja","mejamakan","mejamakanan"],a:0,e:"Meja + makan = meja makan, iaitu meja untuk makan. Susunan kata penting.",x:"Keluarga makan di meja makan."},
      {q:"Gabungan mata + hari yang bermaksud sinar siang menghasilkan kata majmuk mantap ...",o:["mata hari","harimata","matahari","mata-hari"],a:2,e:"Kata majmuk mantap ditulis rapat tanpa jarak, iaitu matahari.",x:"Matahari sangat panas."},
      {q:"Ayah menaiki ____ ke Kuala Lumpur.",o:["makanan","berlari","kereta api","cantik"],a:2,e:"Kereta api ialah kata majmuk bebas yang bermaksud kenderaan di atas landasan.",x:"Kami menaiki kereta api ke Kuala Lumpur."},
      {q:"Kami membeli ____ untuk membuat kerja rumah.",o:["tulisan","menulis","bertulis","buku tulis"],a:3,e:"Buku tulis = buku + tulis, kata majmuk bebas yang bermaksud buku untuk menulis.",x:"Saya membeli buku tulis baharu."},
      {q:"Antara berikut, yang manakah bukan kata majmuk?",o:["jalan raya","kereta api","kapal terbang","berlari"],a:3,e:"Berlari ialah kata berimbuhan (ber- + lari). Ia hanya satu kata akar dengan imbuhan.",x:"ber + lari = berlari"},
      {q:"Bagaimanakah kata majmuk mantap ditulis?",o:["Dirapatkan menjadi satu perkataan","Dipisahkan dengan sempang","Ditulis dua perkataan berjarak","Ditulis dengan huruf besar"],a:0,e:"Kata majmuk mantap ditulis rapat sebagai satu perkataan, contohnya kerjasama dan matahari.",x:"kerja + sama = kerjasama"},
      {q:"Perkataan kerjasama ialah kata majmuk jenis ...",o:["mantap","bebas","ganda","berimbuhan"],a:0,e:"Kerjasama ditulis rapat dan maknanya sudah tetap, maka ia kata majmuk mantap.",x:"Kerjasama memudahkan kerja kumpulan."},
      {q:"Lampu isyarat ialah kata majmuk jenis ...",o:["mantap","ganda penuh","bebas","akhiran"],a:2,e:"Lampu isyarat ditulis berasingan, maka ia kata majmuk bebas.",x:"Pemandu berhenti apabila lampu isyarat merah."},
      {q:"Hospital bermaksud ...",o:["rumah yang buruk","orang sakit","kedai ubat","tempat merawat pesakit"],a:3,e:"Hospital ialah tempat merawat orang sakit atau pesakit.",x:"Datuk dirawat di hospital."},
      {q:"Pilih pasangan kata yang membentuk kata majmuk.",o:["makan + an","ber + jalan","kapal + terbang","buku + buku"],a:2,e:"Kapal + terbang ialah gabungan dua kata, maka ia kata majmuk. Pilihan lain ialah imbuhan atau ganda.",x:"kapal terbang"},
      {q:"Antara berikut, yang manakah bukan kata majmuk mantap?",o:["hulubalang","matahari","kerjasama","jalan raya"],a:3,e:"Jalan raya ditulis berasingan sebagai kata majmuk bebas. Tiga yang lain ditulis rapat.",x:"Kereta lalu di jalan raya."},
      {q:"Ibu memandu kereta di ____.",o:["berjalan","jalan raya","menjalani","perjalanan"],a:1,e:"Jalan raya ialah kata majmuk bebas yang bermaksud jalan besar untuk kenderaan.",x:"Ibu memandu kereta di jalan raya."},
      {q:"Ayat manakah mengandungi kata majmuk?",o:["Adik bermain.","Adik makan nasi.","Adik membaca buku cerita.","Adik sedang berlari."],a:2,e:"Buku cerita = buku + cerita, kata majmuk bebas. Ayat lain tidak mempunyai kata majmuk.",x:"Adik membaca buku cerita."}
    ]
  },

      {q:"Perkataan manakah mengandungi apitan?",o:["keindahan","membaca","bermain","tulisan"],a:0,e:"Keindahan = ke- + indah + -an. Imbuhan berada di hadapan dan di belakang.",x:"Keindahan alam menawan hati."},
      {q:"Ayat manakah mengandungi kata majmuk mantap?",o:["Matahari terbit di timur.","Ali berlari pantas.","Adik bermain bola.","Ibu memasak nasi."],a:0,e:"Matahari ialah kata majmuk mantap kerana ditulis rapat.",x:"Matahari terbit di timur."},
      {q:"Perkataan dibaca mengandungi awalan ...",o:["di-","me-","ber-","ter-"],a:0,e:"Dibaca = di- + baca. Awalan di- bermaksud perbuatan dikenakan pada sesuatu.",x:"Buku itu dibaca oleh adik."},
      {q:"Jalan raya bermaksud ...",o:["jalan besar untuk kenderaan","jalan yang rosak","hari raya","kedai makan"],a:0,e:"Jalan raya ialah kata majmuk bebas yang bermaksud jalan besar untuk kenderaan.",x:"Banyak kereta di jalan raya."},
      {q:"Kakak ____ ke sekolah setiap hari.",o:["berjalan","menjalan","dijalan","jalanan"],a:0,e:"Ber- + jalan = berjalan, iaitu kata kerja yang sesuai dengan ayat ini.",x:"Kakak berjalan ke sekolah."},
      {q:"Perkataan manakah mengandungi awalan ter-?",o:["tidurkan","tertidur","bertidur","tiduran"],a:1,e:"Tertidur = ter- + tidur. Ia bermaksud tidur tanpa sengaja.",x:"Adik tertidur di sofa."},
      {q:"Bilakah kata majmuk terbentuk?",o:["Apabila dua kata atau lebih bergabung dan membawa satu makna","Apabila satu kata diulang","Apabila imbuhan ditambah pada kata akar","Apabila huruf diubah"],a:0,e:"Kata majmuk ialah gabungan dua kata atau lebih yang membawa satu makna.",x:"kereta + api = kereta api"},
      {q:"Perkataan nyalakan mengandungi ...",o:["akhiran -kan","awalan me-","apitan ber-an
