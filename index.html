*{box-sizing:border-box}

body{

  min-height:100vh;

  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(2px 2px at 25px 35px,#fff,transparent),
    radial-gradient(2px 2px at 140px 85px,#ffe57f,transparent),
    radial-gradient(1.5px 1.5px at 80px 160px,#90caf9,transparent),

  opacity:.55;

  z-index:0;
}
@keyframes twinkle{to{opacity:.2}}

.wrap{
  position:relative;
  z-index:2;
  max-width:980px;
  margin:0 auto;
  padding:1.2rem 1rem 3.5rem;
  animation:pop .32s ease-out;
  pointer-events:none;

.wrap>*{pointer-events:auto}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}

.audio-dock{

.audio-btn{

h2{font-size:1.3rem;font-weight:800;color:var(--navy)}

/* ================= ENJIN AUDIO ================= */
const Chiptune = (() => {
  let ctx = null, enabled = false, timer = null;
  const N = { C3:130.81, G3:196.00, C4:261.63, E4:329.63, G4:392.00, C5:523.25, E5:659.25, G5:783.99 };
  const TRACK = ["C4","E4","G4","C5","G4","E4","C4","G3"];
  function ensureCtx(){
    if(!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) ctx = new AC(); }
    if(ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function playTone(freq, dur){
    if(!freq || !ctx) return;
    const now = ctx.currentTime, osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "square"; osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.03, now); gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + dur);
  }
  return {
    enable(){ ensureCtx(); if(!enabled){ enabled = true; this.start(); } },
    toggle(){ ensureCtx(); enabled = !enabled; if(enabled) this.start(); else this.stop(); const b = document.getElementById("musicBtn"); if(b) b.textContent = enabled ? "🎵 Muzik: ON" : "🎵 Muzik: OFF"; },
    start(){ if(timer) clearInterval(timer); let i=0; timer = setInterval(()=>{ playTone(N[TRACK[i++ % TRACK.length]], 0.15); }, 200); },
    stop(){ if(timer){ clearInterval(timer); timer = null; } },
    sfx(f){ ensureCtx(); playTone(f, 0.12); }
  };
})();
const bip = f => Chiptune.sfx(f);
const toggleMusic = () => Chiptune.toggle();

/* ================= SIMPANAN & PENGURUSAN STATE ================= */
const KEY="belajar_digital_v1";
let db; try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
db=db||{teachers:[],students:[]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);

let S=null; try{S=JSON.parse(sessionStorage.getItem("bd_s"))}catch(e){}
let started=Boolean(S);
let loginRole=null, lesson=null, msg="", prefill={u:"",p:""};
let B=null;

function setS(v){
  S=v; if(v) started=true;
  try{v?sessionStorage.setItem("bd_s",JSON.stringify(v)):sessionStorage.removeItem("bd_s")}catch(e){}
  render();
}
const note=()=>msg?`<div class="err" role="alert">${esc(msg)}</div>`:"";

function seedDemo(){
  if(!PAPAR_DEMO||db.demo) return;
  const tid={};
  DEMO.guru.forEach(g=>{
    let t=db.teachers.find(x=>x.u===g[1]);
    if(!t){t={id:uid(),n:g[0],u:g[1],p0:g[2]}; db.teachers.push(t);}
    tid[g[1]]=t.id;
  });
  DEMO.murid.forEach(m=>{
    if(db.students.some(x=>x.u===m[1])) return;
    const p={}; for(const k in m[5]) p[k]={s:m[5][k][0],t:m[5][k][1]};
    db.students.push({id:uid(),t:tid[m[3]],n:m[0],u:m[1],p0:m[2],c:m[4],p});
  });
  db.demo=1; save();
}

function pokemon(id,w,label){
  const found=POKEDEX.find(p=>p.id===id);
  const name=label||(found?found.name:"Pokémon");
  return `<img class="pokemon-sprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png" alt="${esc(name)}" width="${w||100}" height="${w||100}" loading="lazy">`;
}
function mon(c,k,w){ const p=POKEDEX[k]||POKEDEX[0]; return pokemon(p.id,w,p.name); }

const ROLES=[
  ["admin",TEKS.admin,"Urus dunia sekolah",150,"Mewtwo"],
  ["guru",TEKS.guru,"Latih Murid & Pensyarah",6,"Charizard"],
  ["murid",TEKS.murid,"Belajar & Jawab Kuiz",25,"Pikachu"]
];

/* ================= PAPARAN SKRIN ================= */
function startView(){
  return `
  <section class="start-screen">
    <div class="start-grid-floor"></div>
    <div class="start-badge">⚡ POKÉMON ACADEMY ⚡</div>
    <h1 class="start-title">${TEKS.tajuk}</h1>
    <p class="start-sub">Kuasai bahasa sambil bertarung dan menangkap Pokémon!</p>
    <button class="btn-start-game" onclick="enterGame()">▶ MULA</button>
  </section>`;
}

function enterGame(){
  Chiptune.enable();
  started = true;
  render();
  window.scrollTo(0,0);
}

function backToStart(){
  started = false; loginRole = null; render();
}

function home(){
  return `
  <div class="hub-nav">
    <button class="ghost" onclick="backToStart()">⬅ Skrin Mula</button>
    <span class="tag">Mod Akademi</span>
  </div>
  <h1 class="logo">${TEKS.tajuk}</h1>
  <p class="sub">${TEKS.pilih}</p>
  <div class="roles">`+
  ROLES.map(r=>`
    <button class="role role-${r[0]}" onclick="pick('${r[0]}')">
      <div class="mon">${pokemon(r[3],88,r[4])}</div>
      <span><strong>${r[1]}</strong><span class="mut">${r[2]}</span></span>
      <span class="role-arrow">➜</span>
    </button>`).join("")+
  `</div>` + (PAPAR_DEMO ? `<div class="card"><h2>Akaun Demo Pantas</h2><button class="ghost" onclick="demoFill('guru','guru1','guru123')">Isi Login Pensyarah/Guru</button></div>` : "");
}

function loginView(){
  const r=ROLES.find(x=>x[0]===loginRole);
  return `<button class="ghost" onclick="back()">⬅ ${TEKS.kembali}</button>
  <div class="card" style="max-width:440px;margin:1.5rem auto">
    <h2>Log Masuk ${r[1]}</h2>
    ${note()}
    <form onsubmit="login(event)">
      ${loginRole==="admin"?"":`<div class="q"><label>Nama pengguna</label><input id="u" value="${esc(prefill.u)}" required></div>`}
      <div class="q"><label>Kata laluan</label><input id="p" type="password" value="${esc(prefill.p)}" required></div>
      <button type="submit" style="width:100%">▶ Masuk</button>
    </form>
  </div>`;
}

function topBar(title,sub){
  return `<div class="top">
    <div><h1>${esc(title)}</h1><div class="mut">${esc(sub)}</div></div>
    <button class="ghost" onclick="logout()">${TEKS.logKeluar}</button>
  </div>`;
}

const done=s=>LESSONS.filter(l=>s.p[l.id]&&s.p[l.id].s>=need(l)).length;
const need=L=>Math.ceil((L.n||L.q.length)*2/3);

function adminView(){
  return topBar("Admin","Konsol Admin") + `<div class="card"><h2>Pengurusan</h2><p>Sistem aktif.</p></div>`;
}

function guruView(){
  const me=db.teachers.find(t=>t.id===S.id) || {n:"Pensyarah"};
  return topBar("Pensyarah / Guru: "+me.n, "Panel Khas Pensyarah")+
  `<div class="card">
    <h2>⚡ Kawalan Khas Pensyarah</h2>
    <p>Sebagai pensyarah, anda boleh mengakses semua gim, melangkau soalan menggunakan butang 'Skip', dan masuk terus ke Liga Juara.</p>
  </div>` + muridView(true);
}

const monOf=l=>l.mon||{n:"Pikachu",c:"#ffcf33",k:0};

function muridView(isLecturer=false){
  const cards=LESSONS.map(l=>{
    const m=monOf(l);
    return `<div class="card stage">
      <div class="mon">${mon(m.c,m.k,84)}</div>
      <div class="grow">
        <h2>${esc(l.title)}</h2>
        <span class="tag">${esc(l.subject)}</span>
      </div>
      <button onclick="openL('${l.id}')">⚔️ Bertarung / Masuk</button>
    </div>`;
  }).join("");

  return (isLecturer ? "" : topBar("Pelanggan Akademi", "Mod Pelajar")) +
  `<div class="card stage">
     <div class="mon float">${mon("#ffcf33",0,84)}</div>
     <div class="grow">
       <h2>🌍 Peta Misi Lingua Region</h2>
       <p class="mut">Pilih gim di bawah untuk mula belajar dan menjawab soalan.</p>
       <button class="skip-btn" onclick="skipToChampion()" style="margin-top:0.5rem">⏭ [Pensyarah] Skip Terus ke Liga Juara</button>
     </div>
   </div>` + cards;
}

function lessonView(){
  const L=LESSONS.find(l=>l.id===lesson), m=monOf(L);
  if(B.ph==="learn"){
    return `<button class="ghost" onclick="closeL()">⬅ Kembali ke Peta Misi</button>
    <div class="card center" style="margin-top:1rem">
      <h2>${esc(L.title)}</h2>
      <p class="bubble">${esc(L.text).replace(/\n/g,"<br>")}</p>
      <div style="display:flex;gap:0.5rem;justify-content:center">
        <button onclick="startB()">⚡ Mula Pertarungan (3 Soalan)</button>
        <button class="skip-btn" onclick="skipLesson()">⏭ [Pensyarah] Skip Misi Ini</button>
      </div>
    </div>`;
  }
  if(B.ph==="end"){
    return `<div class="card center">
      <h2>Keputusan Misi</h2>
      <div class="big">${B.ok}/${B.qs.length}</div>
      <p><b>Tahniah! Misi selesai.</b></p>
      <button onclick="closeL()">⬅ Kembali ke Peta Misi</button>
    </div>`;
  }

  const q=B.qs[B.q], N=B.qs.length, fb=B.fb;
  return `<button class="ghost" onclick="closeL()" style="margin-bottom:1rem">⬅ Kembali ke Peta Misi</button>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="tag">Soalan ${B.q+1}/${N}</span>
      <button class="skip-btn" onclick="skipCurrentQuestion()">⏭ [Pensyarah] Skip Soalan Ini</button>
    </div>
    <h2 style="margin-top:.55rem">${esc(q.q)}</h2>
    <div class="opts${fb?" lock":""}">`+
      q.o.map((o,j)=>`<button class="${fb?(j===q.a?"ok":j===fb.j?"no":""):""}" onclick="answer(${j})">${esc(o)}</button>`).join("")+
    `</div>`+
    (fb?`<div class="fbbox ${fb.right?"good":"try"}">
      <b>${fb.right?"🎉 Betul!":"💪 Jawapan salah."}</b>
      <p>📘 ${esc(q.e)}</p>
      <button onclick="nextQ()">Soalan Seterusnya ➡</button>
    </div>`:"")+
  `</div>`;
}

/* ================= KAWALAN & LOGIK ================= */
function render(){
  const a=$("#app");
  if(!S){
    a.innerHTML = !started ? startView() : (loginRole ? loginView() : home());
  } else if(S.role==="admin"){
    a.innerHTML=adminView();
  } else if(S.role==="guru"){
    a.innerHTML=guruView();
  } else {
    a.innerHTML = lesson ? lessonView() : muridView();
  }
  msg=""; prefill={u:"",p:""};
}

const pick=r=>{loginRole=r; msg=""; render()};
const demoFill=(r,u,p)=>{started=true; loginRole=r; prefill={u,p}; msg=""; render()};
const back=()=>{loginRole=null; render()};
const logout=()=>{loginRole=null; lesson=null; B=null; setS(null)};

function login(e){
  e.preventDefault();
  const f=e.target, p=f.p.value, u=f.u?f.u.value.trim().toLowerCase():"";
  if(loginRole==="admin" && p===ADMIN_PASS) return setS({role:"admin"});
  if(loginRole==="guru"){
    let found = DEMO.guru.find(g=>g[1]===u && g[2]===p) || db.teachers.find(t=>t.u===u && t.p0===p);
    if(found) return setS({role:"guru", id: found.id || "g1"});
  }
  msg=TEKS.salahLogin; render();
}

function openL(id){
  lesson=id; B={ph:"learn", q:0, ok:0, qs:[]}; render(); window.scrollTo(0,0);
}
function closeL(){ lesson=null; B=null; render(); }

function startB(){
  const L=LESSONS.find(l=>l.id===lesson);
  B.qs = L.q.slice(0, 3); // Pastikan 3 soalan sahaja
  B.q = 0; B.ok = 0; B.fb = null; B.ph = "fight";
  render();
}

function answer(j){
  if(!B || B.fb) return;
  const q=B.qs[B.q], right=(j===q.a);
  B.fb={j, right};
  if(right) B.ok++;
  render();
}

function nextQ(){
  if(!B || !B.fb) return;
  B.fb=null; B.q++;
  if(B.q >= B.qs.length) B.ph="end";
  render();
}

/* Fungsi Skip Khas untuk Pensyarah */
function skipCurrentQuestion(){
  if(!B) return;
  B.ok++; B.fb=null; B.q++;
  if(B.q >= B.qs.length) B.ph="end";
  render();
}

function skipLesson(){
  if(!B) return;
  B.ok = 3; B.ph = "end";
  render();
}

function skipToChampion(){
  openL("c1");
}

seedDemo();
render();
</script>
<script src="lingua/lingua.js"></script>
</body>
